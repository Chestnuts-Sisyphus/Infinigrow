name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    # T9/G11：引擎实际跑在 Windows 上，CI 就必须在 Windows 上跑一遍。
    # 只测 Linux 的「跨平台」，是把「没测过的平台」当成了「能用的平台」。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests (pytest)
        run: python -m pytest -q

      - name: Static rules (零 token)
        run: python -m infinigrow scan

      - name: Rule self-test (正/反用例)
        run: python -m infinigrow selftest

      - name: Prompt ↔ code sync (同源校验机)
        run: python tools/check_prompt_code_sync.py

      - name: Privacy scan (通用层：路径/凭据/邮箱)
        run: python tools/privacy_scan.py --root .

      # O5/T12 的验收项：**冷启动空仓跑一拍**——空状态目录 + 零 token。
      # 这一关过了，才说明「引擎能在没有任何个人数据的环境里转起来」。
      - name: Cold start — 空仓零 token 跑三拍
        env:
          IG_STATE_ROOT: ${{ runner.temp }}/infinigrow-state
          IG_SUBJECT_ROOT: ${{ runner.temp }}/infinigrow-subject
        run: |
          python -m infinigrow dry-run
          # org-check sits before the ticks on purpose: on an empty state root the
          # answer is "run it" (rc=0), so no `|| true` is needed. Since v2.2.27 a
          # "not this tick" answer has its own code (5), which the old `|| true`
          # could not tell apart from a real usage error (1).
          python -m infinigrow org-check --tick 9
          python -m infinigrow tick --tick 1 --probe
          python -m infinigrow tick
          python -m infinigrow tick
          python -m infinigrow gardener
          python -m infinigrow org-status

      # 产物不得含绝对路径：用仓库自带的跨平台工具（原先那段 bash heredoc
      # 在 windows runner 上跑不了——同一个检查拆成三份脚本，本身就是漂移源）。
      #
      # 路径用 GitHub 表达式写（`${{ runner.temp }}`）：它在 bash 与 pwsh 里都成立。
      # 用 `$IG_STATE_ROOT` 这种 shell 变量是踩过的坑——PowerShell 里那是对的写法
      # 但值取不到（应写 `$env:IG_STATE_ROOT`），结果参数为空、工具去扫了 `.`，
      # 报出一堆与产物无关的命中（红色的理由完全指错地方）。
      - name: Cold start — 产物不得含绝对路径
        run: python tools/check_no_abs_paths.py "${{ runner.temp }}/infinigrow-state"

      # Read surface of the CLI: status / redemption --json / rotate / rotate --search /
      # version --check. Before v2.2.28 no CI ever ran any of them — they are how a user
      # reads the engine, and the docs publish `rotate --search` as the entry point for
      # "archived is still findable". Reusing the cold-start state root above means the
      # ledgers already have rows, so these run against content, not an empty dir.
      # The hit/miss directions of --search are pinned by tests/test_cli_surface.py.
      - name: CLI read surface
        env:
          IG_STATE_ROOT: ${{ runner.temp }}/infinigrow-state
          IG_SUBJECT_ROOT: ${{ runner.temp }}/infinigrow-subject
        run: |
          python -m infinigrow status
          python -m infinigrow redemption --json
          python -m infinigrow rotate
          python -m infinigrow rotate --search outcomes
          python -m infinigrow version --check

      # 一键件与计划任务脚本也要在 CI 里被解析一遍（windows runner 上有 PowerShell）
      - name: 一键件语法（批处理/PowerShell 解析）
        run: python -m pytest -q tests/test_scheduler_artifacts.py
